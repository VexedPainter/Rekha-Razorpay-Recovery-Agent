belay_contract: '0.1'
tool: list_allowed_directories
summary: Return the list of directories this server is allowed to access.
reversibility: reversible
undo:
  tool: list_allowed_directories
  args: {}
effects:
  - type: read
    resource: filesystem.server
    count: "1"
provenance:
  declared_by: integrator
  verified: true
---
belay_contract: '0.1'
tool: write_file
summary: Create a new file, or completely overwrite an existing one, with new content.
reversibility: conditional
conditions:
  - "$state.before.isError != true"
capture:
  tool: read_file
  args:
    path: "$args.path"
  as: before
undo:
  tool: write_file
  args:
    path: "$args.path"
    content: "$state.before.content"
effects:
  - type: update
    resource: filesystem.file
    count: "1"
verification:
  tool: read_file
  args:
    path: "$args.path"
provenance:
  declared_by: integrator
  verified: true
---
belay_contract: '0.1'
tool: edit_file
summary: Make line-based find/replace edits to an existing text file (git-style diff response).
reversibility: reversible
capture:
  tool: read_file
  args:
    path: "$args.path"
  as: before
undo:
  tool: write_file
  args:
    path: "$args.path"
    content: "$state.before.content"
effects:
  - type: update
    resource: filesystem.file
    count: "1"
verification:
  tool: read_file
  args:
    path: "$args.path"
provenance:
  declared_by: integrator
  verified: true
---
belay_contract: '0.1'
tool: move_file
summary: Move or rename a file/directory (fails if the destination already exists -- never silently overwrites).
reversibility: reversible
undo:
  tool: move_file
  args:
    source: "$args.destination"
    destination: "$args.source"
effects:
  - type: update
    resource: filesystem.file
    count: "1"
provenance:
  declared_by: integrator
  verified: true
---
belay_contract: '0.1'
tool: create_directory
summary: Create a new directory (or ensure one exists, succeeding silently if it already does).
reversibility: irreversible
effects:
  - type: create
    resource: filesystem.directory
    count: "1"
provenance:
  declared_by: integrator
  verified: true
