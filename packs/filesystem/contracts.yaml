# PACK-001 Filesystem (plan-v2 E20.1) -- contracts for the REAL, official
# `@modelcontextprotocol/server-filesystem` MCP server (verified against
# the actual installed npm package, not guessed from its README):
#
#   npx -y @modelcontextprotocol/server-filesystem <allowed-directory>
#
# Every field below (tool names, exact input/output shapes, error
# behavior) was confirmed by actually calling the real, running server --
# see tests/packs/test_filesystem_pack.py, which drives these contracts
# against that same real server, not a mock. `belay draft-contracts`'s own
# heuristic pass over this server got several of these wrong in ways
# fixed by hand below:
#
# - `edit_file`/`move_file` were drafted as irreversible ("no read
#   counterpart found") -- both actually have a well-defined undo, just
#   not the same-tool-name pairing the heuristic looks for.
# - `create_directory`'s draft undo called `create_directory` itself with
#   a nonsensical `content` argument it doesn't accept -- this server has
#   NO delete/remove-directory tool at all, so directory creation is
#   genuinely irreversible via this pack, full stop.
#
# `write_file`'s capture (`read_file`) hard-errors (MCP `isError: true`,
# not a soft "not found" flag) when the target file doesn't exist yet --
# confirmed empirically, not assumed. That capture failure does NOT abort
# the write (belay/proxy/server.py's real executor never raises on
# `isError`, it just returns the CallToolResult; belay/executor/saga.py's
# `_as_dict` folds `isError`/`content` into the captured state dict
# either way) -- so creating a brand-new file always succeeds, it just
# isn't reversible, which the `conditional` reversibility below captures
# honestly rather than either lying about it (claiming `reversible`
# unconditionally) or blocking new-file writes outright (claiming
# `irreversible` unconditionally, which would also deny the always-safe
# overwrite-an-existing-file case).

belay_contract: '0.1'
tool: read_file
summary: Read the complete contents of a file as text (deprecated upstream in favor of read_text_file, kept here since it's still a real, callable tool).
reversibility: reversible
undo:
  tool: read_file
  args:
    path: "$args.path"
effects:
  - type: read
    resource: filesystem.file
    count: "1"
provenance:
  declared_by: integrator
  verified: true
---
belay_contract: '0.1'
tool: read_text_file
summary: Read the complete contents of a file from the file system as text.
reversibility: reversible
undo:
  tool: read_text_file
  args:
    path: "$args.path"
effects:
  - type: read
    resource: filesystem.file
    count: "1"
provenance:
  declared_by: integrator
  verified: true
---
belay_contract: '0.1'
tool: read_media_file
