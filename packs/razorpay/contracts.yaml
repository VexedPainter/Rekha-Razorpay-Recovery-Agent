---
# The primary recovery action.
#
# `capture` reads the link back by its reference id before creating it, so the
# compensation is materialized against observed state rather than an assumption.
# The capture tool is `fetch_all_payment_links`, which is read-only -- required,
# and enforced by `SagaExecutor._check_capture_is_read_only`.
belay_contract: "0.1"
tool: create_payment_link
summary: Create a standard payment link to recover a failed payment.
reversibility: conditional
conditions:
  # Evaluated at commit time against the created link. A link that is somehow
  # already paid by the moment we commit cannot be cancelled, so it registers as
  # irreversible rather than claiming an undo that would fail.
  - "$result.status != 'paid'"
undo:
  tool: cancel_payment_link
  args:
    payment_link_id: "$result.id"
idempotent: false
idempotency_key: "$args.reference_id"
effects:
  - type: create
    resource: razorpay.payment_link
    count: "1"
  - type: spend
    resource: razorpay.payment_link
    count: "1"
    amount_from:
      minor_units: "$args.amount"
      currency: "$args.currency"
redact:
  - customer.contact
  - customer.email
provenance:
  declared_by: integrator
  verified: false
---
belay_contract: "0.1"
tool: create_payment_link_upi
summary: Create a UPI-only payment link to recover a failed payment.
reversibility: conditional
conditions:
  - "$result.status != 'paid'"
undo:
  tool: cancel_payment_link
  args:
    payment_link_id: "$result.id"
idempotency_key: "$args.reference_id"
effects:
  - type: create
    resource: razorpay.payment_link
    count: "1"
  - type: spend
    resource: razorpay.payment_link
    count: "1"
    amount_from:
      minor_units: "$args.amount"
      currency: "$args.currency"
redact:
  - customer.contact
  - customer.email
provenance:
  declared_by: integrator
  verified: false
---
# Irreversible: an SMS or email cannot be unsent. `recipients: "1"` exists so a
# policy `max_recipients` cap can bound a broadcast.
belay_contract: "0.1"
tool: send_payment_link
summary: Send an existing payment link to the customer over SMS or email.
reversibility: irreversible
idempotency_key: "$args.payment_link_id"
effects:
  - type: send
    resource: razorpay.payment_link
    count: "1"
    recipients: "1"
provenance:
  declared_by: integrator
  verified: false
---
# Declared so it can serve as the `undo` above. Compensations pass through the
# policy engine too (spec §12), so a cancellation is a governed action in its
# own right and needs a contract like any other.
belay_contract: "0.1"
tool: cancel_payment_link
summary: Cancel an unpaid payment link. The compensation for link creation.
reversibility: irreversible
effects:
  - type: update
    resource: razorpay.payment_link
    count: "1"
provenance:
  declared_by: integrator
  verified: false
---
# Deliberately declared, deliberately working, and forbidden by the demo
# mandate (examples/mandates/merchant.yaml).
#
# This is what makes the prompt-injection scenario a real demonstration rather
# than theatre. A planted instruction in a payment's `notes` field can persuade
# the AI to propose a refund; the tool exists and would succeed. What refuses it
# is the merchant's mandate, checked before this contract is even resolved. If
# the tool were simply absent, the scenario would prove nothing about
# authorization -- only about a missing integration.
belay_contract: "0.1"
tool: create_refund
summary: Refund a captured payment. Irreversible -- a refund cannot be un-refunded.
reversibility: irreversible
idempotency_key: "$args.payment_id"
effects:
  - type: spend
    resource: razorpay.refund
    count: "1"
    amount_from:
      minor_units: "$args.amount"
      currency: "$args.currency"
provenance:
  declared_by: integrator
  verified: false
