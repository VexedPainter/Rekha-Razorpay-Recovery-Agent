# Razorpay action contracts for AI revenue recovery.
#
# This file IS the agent's action space. `belay/proxy/lifecycle.py::resolve()`
# refuses any tool with no contract here (`contract_missing`, spec §4.6
# default-deny), so an action that is not declared below cannot be proposed,
# planned, or executed -- not because the agent is well-behaved, but because
# there is no code path for it.
#
# Tool names, argument names and response shapes match the official
# `razorpay/razorpay-mcp-server` and the underlying REST API, so this pack is
# valid against both the real server and `examples/razorpay-sandbox`.
# `tests/razorpay/test_razorpay_pack.py` pins that correspondence and fails if
# either side drifts.
#
# Reversibility, decided per action on what is financially true rather than
# what is convenient:
#
#   reads                 -> irreversible + `read` effects. Nothing to undo.
#   create_payment_link   -> CONDITIONAL. The undo is cancellation, and that
#                            only works while the link is unpaid. A paid link
#                            genuinely cannot be cancelled (the sandbox and the
#                            real API both refuse it), so the condition is
#                            evaluated at commit time and an already-paid link
#                            registers as irreversible instead of pretending.
#   send_payment_link     -> irreversible. An SMS cannot be unsent.
#   create_refund         -> irreversible. Money out of the door.
#
# Every mutating action declares an `idempotency_key` over its arguments, so a
# retried recovery cannot create a second link or a second refund.
#
# `redact` keeps customer contact details out of the hash-chained ledger. The
# evidence needs to prove what was authorized, not to accumulate PII.
#
# provenance.verified is false: these are hand-authored and tested against the
# sandbox plus the real server's advertised tool list, but not against a real
# settled Razorpay payment. Marking them verified would be a claim we have not
# earned.

belay_contract: "0.1"
tool: fetch_all_payments
summary: List payments, newest first, optionally filtered by status.
reversibility: irreversible
effects:
  - type: read
    resource: razorpay.payment
    # Bounded by the caller's count argument; ~ marks it an estimate.
    # spec A6.3 worst-cases an unknown count, and an unknown READ count would
    # therefore pause cohort analysis -- so it is declared, not omitted.
    count: "~100"
provenance:
  declared_by: integrator
  verified: false
---
belay_contract: "0.1"
tool: fetch_payment
summary: Fetch one payment with its full failure detail.
reversibility: irreversible
effects:
  - type: read
    resource: razorpay.payment
    count: "1"
provenance:
  declared_by: integrator
  verified: false
