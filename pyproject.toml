[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belay-mcp"
version = "0.2.0a1"
description = "An MCP proxy giving AI agents safe, reversible tool execution: contracts, dry-run planning, policy, approvals, saga execution, and rewind."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Belay contributors" }]
keywords = ["mcp", "agents", "safety", "contracts", "saga", "rollback"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # mcp 2.0.0 (released after this pin was last checked) renamed its
    # camelCase Pydantic field aliases to snake_case (Tool.inputSchema ->
    # input_schema, ToolAnnotations.readOnlyHint -> read_only_hint,
    # CallToolResult.isError/structuredContent -> is_error/
    # structured_content) and moved/removed
    # mcp.shared.memory.create_connected_server_and_client_session --
    # genuine breaking changes belay/proxy/server.py, belay/contracts/
    # draft.py, and belay/cli/main.py are not yet updated for (found via a
    # real fresh CI install, not assumed). Pinned below 2.0 until that
    # migration happens as its own dedicated, tested piece of work --
    # not attempted piecemeal alongside unrelated changes.
    "mcp>=1.0,<2.0",
    "anyio>=4.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
    "cryptography>=42.0",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Jairogelpi/belay-mcp"
Specification = "https://github.com/Jairogelpi/belay-mcp/blob/main/docs/spec.md"

[project.scripts]
belay = "belay.cli.main:main"
belay-conformance = "conformance.cli:main"

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    # scripts/release_preflight.py (E23) parses PEP 440 versions with this --
    # a dev/release-time tool, never imported by the shipped `belay` package
    # itself, so it belongs in `dev`, not the runtime dependency list above.
    "packaging>=23.0",
]
build = [
    "pyinstaller>=6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["belay", "conformance"]

[tool.hatch.build.targets.wheel.force-include]
# The conformance suite locates fixtures via `Path(__file__).parents[2] /
# "examples"` (repo-root-relative in dev) -- shipping `examples/` as a
# top-level sibling of `belay/`/`conformance/` in the wheel keeps that
# same relative path valid for an installed `belay-conformance` too.
"examples" = "examples"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["belay", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^tests/", "^conformance/tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "conformance.tests.*"
strict = false
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--cov=belay --cov-branch --cov-report=term-missing -m \"not slow and not live_conformance\""
testpaths = ["tests"]
markers = [
    "slow: starts a real MCP subprocess or otherwise runs noticeably longer than the fast suite",
    "live_conformance: spawns a real host CLI binary (claude, codex, ...) and calls its real backing API -- costs real usage/credits, opt-in only, never part of the default suite or CI",
]

[tool.coverage.run]
source = ["belay"]

[tool.coverage.report]
# Measured Python 3.13 safe fast-gate branch coverage was 81.15% on
# 2026-08-12. The enforceable floor is 81%, is upward-only, and must never be
# silently lowered. The historical target remains 90% (docs/plan.md section 0).
fail_under = 81
exclude_also = ["if TYPE_CHECKING:"]
