[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekha"
version = "0.3.0a1"
description = "AI revenue recovery for Razorpay, with a deterministic financial control plane: merchant mandates, policy limits, approvals, idempotency, hash-chained evidence, and settlement verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Rahul J" }]
keywords = ["razorpay", "payments", "agents", "revenue-recovery", "mcp", "settlement", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # mcp 2.0.0 (released after this pin was last checked) renamed its
    # camelCase Pydantic field aliases to snake_case (Tool.inputSchema ->
    # input_schema, ToolAnnotations.readOnlyHint -> read_only_hint,
    # CallToolResult.isError/structuredContent -> is_error/
    # structured_content) and moved/removed
    # mcp.shared.memory.create_connected_server_and_client_session --
    # genuine breaking changes rekha/proxy/server.py, rekha/contracts/
    # draft.py, and rekha/cli/main.py are not yet updated for (found via a
    # real fresh CI install, not assumed). Pinned below 2.0 until that
    # migration happens as its own dedicated, tested piece of work --
    # not attempted piecemeal alongside unrelated changes.
    "mcp>=1.0,<2.0",
    "anyio>=4.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
    "cryptography>=42.0",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/rahuljaiprakash/rekha"
Specification = "https://github.com/rahuljaiprakash/rekha/blob/main/docs/spec.md"

[project.scripts]
rekha = "rekha.cli.main:main"
rekha-conformance = "conformance.cli:main"

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["rekha", "conformance", "recovery", "bench"]

[tool.hatch.build.targets.wheel.force-include]
# The conformance suite locates fixtures via `Path(__file__).parents[2] /
# "examples"` (repo-root-relative in dev) -- shipping `examples/` as a
# top-level sibling of `rekha/`/`conformance/` in the wheel keeps that
# same relative path valid for an installed `rekha-conformance` too.
"examples" = "examples"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["rekha", "recovery", "bench", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^tests/", "^conformance/tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "conformance.tests.*"
strict = false
ignore_errors = true

[[tool.mypy.overrides]]
# `cohort` lives in examples/razorpay-sandbox/ and is imported by path at runtime
# (bench/evaluate.py adds that directory to sys.path). It is a standalone sandbox
# module rather than an installed package, so mypy cannot resolve it statically. The
# import is exercised by tests/bench/, which is the check that actually matters.
module = "cohort"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=rekha --cov=recovery --cov-branch --cov-report=term-missing -m \"not slow and not live_conformance and not live_llm and not live_razorpay\""
testpaths = ["tests"]
markers = [
    "slow: starts a real MCP subprocess or otherwise runs noticeably longer than the fast suite",
    "live_conformance: spawns a real host CLI binary (claude, codex, ...) and calls its real backing API -- costs real usage/credits, opt-in only, never part of the default suite or CI",
    "live_llm: calls a real LLM provider API -- costs real usage/credits, opt-in only, never part of the default suite or CI. The default suite exercises the same code paths against recorded fixtures in recovery/fixtures/.",
    "live_razorpay: calls the real Razorpay API in TEST MODE via the official MCP server -- needs credentials and Docker, opt-in only, never part of the default suite or CI.",
]

[tool.coverage.run]
# The recovery package is measured too: it is a first-class package with real
# logic, and leaving the AI layer unmeasured would hide exactly the code most
# likely to have been written in a hurry.
source = ["rekha", "recovery"]

[tool.coverage.report]
# Measured branch coverage was 83.95% on 2026-08-25, immediately after the
# Phase 1 strip removed the adoption/DX surface that had been dragging the
# global number down (it was 82.15% across a codebase twice this size). The
# enforceable floor is 83%, is upward-only, and must never be silently
# lowered -- raise it as more lands. See ADR 0028.
fail_under = 83
exclude_also = ["if TYPE_CHECKING:"]
