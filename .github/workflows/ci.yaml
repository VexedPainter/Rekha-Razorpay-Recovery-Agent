name: CI

on:
  push:
    branches: [main, razorpay-recovery]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy rekha
      - name: Test (fast branch-coverage gate)
        run: pytest
      - name: Test (slow, non-live, no coverage)
        run: pytest -m "slow and not live_conformance" --no-cov
      - name: Spec MUST traceability
        run: python scripts/traceability.py --check

  wheel-smoke:
    # Editable installs (`pip install -e .`) hide packaging bugs: missing
    # package-data, wrong deps. This installs ONLY the built wheel in a
    # throwaway venv and runs the real conformance suite against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Install wheel only (no repo, no dev extras)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: Conformance against the installed wheel
        run: |
          cd /tmp
          /tmp/wheel-venv/bin/rekha-conformance run --target rekha --level 3

  cross-platform-clean-room:
    # The fast suite on a genuinely clean VM per OS. One Python version per
    # OS: this job is about platform coverage, not re-running the version
    # matrix the `test` job above already covers.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (fast branch-coverage gate)
        run: pytest
