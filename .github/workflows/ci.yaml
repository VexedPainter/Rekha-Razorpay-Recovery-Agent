name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy belay
      - name: Test (fast loop)
        run: pytest
      - name: Test (full suite, incl. slow)
        run: pytest -m "" --no-cov
      - name: Spec MUST traceability
        run: python scripts/traceability.py --check

  wheel-smoke:
    # Editable installs (`pip install -e .`) hide packaging bugs: missing
    # package-data, wrong deps. This installs ONLY the built wheel in a
    # throwaway venv and runs the real quickstart against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Install wheel only (no repo, no dev extras)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: Quickstart against the installed wheel
        run: |
          cd /tmp
          /tmp/wheel-venv/bin/belay-conformance run --target belay --level 3

  cross-platform-clean-room:
    # plan-v2 E19.7: the fast test suite, on a genuinely clean VM per OS --
    # every GitHub Actions runner starts fresh, nothing pre-installed beyond
    # the image defaults -- across every OS belay claims to support. One
    # Python version per OS (3.13): this job is about platform coverage, not
    # re-running the full version matrix the `test` job above already covers
    # on Linux three times over.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (fast loop)
        run: pytest

  build-binaries:
    # plan-v2 E19.5: standalone, no-Python-required `belay` executables,
    # one per OS, built and smoke-tested on that OS's own real runner --
    # not cross-compiled and hoped to work.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[build]"
      - name: Build binary
        run: python scripts/build_binary.py
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=dist-bin/belay
          if [ ! -f "$BIN" ]; then BIN=dist-bin/belay.exe; fi
          "$BIN" --help
      - uses: actions/upload-artifact@v4
        with:
          name: belay-${{ matrix.os }}
          path: dist-bin/belay*
          if-no-files-found: error
