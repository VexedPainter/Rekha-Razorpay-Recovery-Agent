name: Release

# E23: a release recoverable BY AN IMMUTABLE TAG. Two triggers:
#
#   1. `push: tags: v*.*.*`      -- the normal path.
#   2. `workflow_dispatch`        -- the recovery path (docs/release-runbook.md):
#      if this workflow itself had a bug on its first run against a tag,
#      a human fixes the WORKFLOW FILE via a normal PR to `main`, merges
#      it, then re-dispatches THIS (repaired) workflow manually, passing
#      the SAME already-pushed tag name again. The tag is never moved,
#      recreated, or force-updated -- only this workflow's own code on
#      `main` is ever repaired.
#
# Both paths converge on the same `resolve` job, which independently
# resolves the given tag to its exact, immutable commit SHA (never
# trusting `GITHUB_SHA`/the ref that triggered the run) and checks out
# THAT SHA in every job that builds anything -- so a recovery re-dispatch
# builds the exact same candidate commit the original tag push did, not
# whatever `main` has drifted to since.
#
# No PyPI API tokens/secrets: publishing relies on PyPI's trusted
# publisher configuration for this repo+workflow
# (https://docs.pypi.org/trusted-publishers/), which a maintainer must set
# up on the PyPI project first -- an agent cannot do that. The `publish-
# pypi` job's condition (`vars.PYPI_PUBLISH_ENABLED == 'true'`) is an
# explicit repository-variable gate, absent/false by default -- every
# other job runs and is useful release signal regardless of PyPI status.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing, already-pushed tag to (re-)release, e.g. v0.2.0a1"
        required: true
        type: string

jobs:
  resolve:
    # The single source of truth every other job below builds from. Runs
    # from THIS job's own default-branch checkout (`ref: main`) -- not the
    # tag itself -- so a workflow repaired on `main` is what actually
    # executes even on a recovery re-dispatch against an old tag.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (release_preflight.py's only import beyond stdlib)
        run: pip install packaging
      - name: Resolve the tag to its exact, immutable commit SHA
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          python scripts/release_preflight.py resolve-tag --tag "$TAG" > resolved.json
          cat resolved.json
          SHA=$(python -c "import json; print(json.load(open('resolved.json'))['sha'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy belay
      - name: Test (fast branch-coverage gate)
        run: pytest
      - name: Test (slow, non-live, no coverage)
        run: pytest -m "slow and not live_conformance" --no-cov
      - name: Spec MUST traceability
        run: python scripts/traceability.py --check

  build-source:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: belay-dist
          path: dist/
          if-no-files-found: error

  build-binaries:
    needs: [resolve, test]
    # plan-v2 E19.5: standalone, no-Python-required `belay` executables,
    # one per OS, built and smoke-tested on that OS's own real runner.
    # `asset_name` is what release_preflight.py verify-artifacts's
    # classify_artifact() (scripts/release_preflight.py) actually keys
    # off of -- an OS marker in the filename itself, since a bare
    # PyInstaller `belay`/`belay.exe` output carries none of its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: belay-linux-x86_64
          - os: macos-latest
            asset_name: belay-macos-x86_64
          - os: windows-latest
            asset_name: belay-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[build]"
      - name: Build binary
        run: python scripts/build_binary.py
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=dist-bin/belay
          if [ ! -f "$BIN" ]; then BIN=dist-bin/belay.exe; fi
          "$BIN" --help
      - name: E22/E23 zero-config connect smoke (frozen binary, isolated homes)
        # scripts/smoke_connect.py --expect-frozen: a real MCP session
        # THROUGH this exact just-built binary against the real pinned
        # Filesystem upstream (list-tools, in-project write, out-of-
        # project confinement), driven against a FAKE detected client
        # (never this runner's own real codex/claude config) -- and
        # asserts the recorded launch command is the absolute binary
        # itself plus `run --config ...`, never a python interpreter.
        shell: bash
        run: |
          BIN=dist-bin/belay
          if [ ! -f "$BIN" ]; then BIN=dist-bin/belay.exe; fi
          mkdir -p /tmp/smoke-connect-release
          python scripts/smoke_connect.py \
            --belay "$(pwd)/$BIN" \
            --bin-dir /tmp/smoke-connect-release/bin \
            --home /tmp/smoke-connect-release/home \
            --project /tmp/smoke-connect-release/project \
            --expect-frozen
      - name: Rename the binary to its release asset name
        shell: bash
        run: |
          BIN=dist-bin/belay
          if [ ! -f "$BIN" ]; then BIN=dist-bin/belay.exe; fi
          mv "$BIN" "dist-bin/${{ matrix.asset_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist-bin/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: [resolve, build-source, build-binaries]
    runs-on: ubuntu-latest
    # The repo's own default workflow token permission is read-only
    # (`gh api repos/.../actions/permissions/workflow` -> "read") --
    # confirmed the hard way (E23 Task 8's first real v0.2.0a1 run: `gh
    # release create`/`upload` 403'd, "Resource not accessible by
    # integration"). `contents: write` is exactly what creating/editing a
    # release and uploading its assets needs, scoped to this job only, the
    # same least-privilege pattern `publish-pypi` below already uses for
    # its own `id-token: write`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (release_preflight.py's only import beyond stdlib)
        run: pip install packaging
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Verify the five-class artifact inventory
        run: |
          python scripts/release_preflight.py verify-artifacts \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --directory release-assets
      - name: Flatten downloaded artifacts for upload (per-artifact subdirs -> one dir)
        shell: bash
        run: |
          mkdir -p release-assets-flat
          find release-assets -type f -exec cp {} release-assets-flat/ \;
      - name: Determine the prerelease flag from the tag's PEP 440 pre-release segment
        id: assemble
        shell: bash
        # A multi-line, indented `python -c "..."` here is a real trap: bash
        # passes the quoted string's literal indentation straight through as
        # part of the Python source, and Python rejects a module-level
        # statement that starts indented (`IndentationError: unexpected
        # indent`) -- confirmed by actually running this exact pattern
        # locally. A single-line -c command has no indentation to get wrong.
        run: |
          python -c "from packaging.version import Version; tag='${{ needs.resolve.outputs.tag }}'; print('is_prerelease=' + str(Version(tag[1:]).is_prerelease).lower())" >> "$GITHUB_OUTPUT"
      - name: Create or update the GitHub release (never moves the tag)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.assemble.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" $PRERELEASE_FLAG
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" \
              --notes "See CHANGELOG.md." $PRERELEASE_FLAG
          fi
          # --clobber replaces only assets sharing OUR OWN filenames (the
          # five release_preflight.py classes just verified above) on a
          # recovery re-run -- it never touches a differently-named,
          # unrelated asset already on the release.
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            release-assets-flat/*

  publish-pypi:
    needs: [resolve, release]
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/belay-mcp
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: belay-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
